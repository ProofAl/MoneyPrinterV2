name: Archived Repo Offline Review

# Inactive repository: no schedules, posting, scraping, outreach or model calls.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "src/**/*.py"
      - "scripts/**/*.py"
      - "scripts/review/**"
      - ".github/workflows/archived-security-review.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: archived-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  read-only-review:
    name: archived-static-advisory
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout only source, never profiles or credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - name: Fetch immutable scanner image
        shell: bash
        run: docker pull semgrep/semgrep@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b
      - name: Run no-network advisory scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mpv2-security"
          docker run --rm --network none --read-only \
            --user "$(id -u):$(id -g)" --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 \
            --env HOME=/tmp --tmpfs /tmp:rw,nosuid,nodev,mode=1777,size=256m \
            --workdir /src \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/mpv2-security:/out:rw" \
            semgrep/semgrep@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b \
            semgrep scan --config scripts/review/semgrep-rules.yml \
              --metrics=off --disable-version-check --strict \
              --max-target-bytes 1000000 --json --quiet \
              --output /out/findings.json /src
      - name: Report static findings, not app activity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'mpv2-security/findings.json'
          result = json.loads(p.read_text(encoding='utf-8'))
          errors, findings = result.get('errors') or [], result.get('results') or []
          scanned = len((result.get('paths') or {}).get('scanned') or [])
          if errors or scanned == 0:
              raise SystemExit('Static review did not complete')
          summary = ['## Archived MoneyPrinterV2 static advisory',
                     f'Scanned files: {scanned}',
                     f'Advisory findings: {len(findings)}',
                     'No application, SMTP, Selenium, social or upload workflows executed.']
          for f in findings[:30]:
              summary.append(f"- {f.get('check_id', '?')} "
                             f"{f.get('path', '?')}:{f.get('start', {}).get('line', '?')}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as o:
              o.write('\n'.join(summary) + '\n')
          PY
